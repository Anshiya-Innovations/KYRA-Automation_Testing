# ==============================================================================
# KYRA Automation Framework Configuration
# ==============================================================================

# Application Base URL
app.baseUrl=http://localhost:8080/test/flp.html?sap-ui-xx-viewCache=false#app-preview

# Browser Settings
# Set browser.headless=false to view execution in headed Chromium
browser.headless=false
browser.slowMo=200
browser.maximized=true

# Page Zoom Scaling (e.g. 0.85 = 85% zoom to ensure full card visibility on all laptop/desktop screens)
browser.zoom=0.85

# Timeouts in Milliseconds
timeout.default=10000
timeout.navigation=15000

# Test Credentials & Personas
persona.requester.name=Requester
persona.requester.id=emp010

persona.approver.name=Approver
persona.approver.id=emp085

persona.compliance.name=Compliance Review
persona.compliance.id=emp095
